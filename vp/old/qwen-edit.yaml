version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
env: 
  GITHUB_TOKEN: GITHUB_TOKEN
git_repos:
  - url: https://github.com/develephant/ComfyUI-Eve-Nodes.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-Eve-Nodes"
  - url: https://github.com/city96/ComfyUI-GGUF.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-GGUF"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt"   
downloads:
  - url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/qwen_image_vae.safetensors
  - url: https://huggingface.co/lightx2v/Qwen-Image-Edit-2511-Lightning/resolve/main/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/loras/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
  - url: https://huggingface.co/fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA/resolve/main/qwen-image-edit-2511-multiple-angles-lora.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/loras/qwen-image-edit-2511-multiple-angles-lora.safetensors
  - url: https://huggingface.co/Comfy-Org/Qwen-Image-Edit_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_edit_2511_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/qwen_image_edit_2511_int8_convrot.safetensors
  - url: https://huggingface.co/Comfy-Org/HunyuanVideo_1.5_repackaged/resolve/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
