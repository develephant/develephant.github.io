version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
env: 
  GITHUB_TOKEN: GITHUB_TOKEN
git_repos:
  - url: https://github.com/develephant/ComfyUI-Eve-Nodes.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-Eve-Nodes"
  - url: https://github.com/HellerCommaA/ComfyUI-ZImageLatent.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-ZImageLatent"
  - url: https://github.com/city96/ComfyUI-GGUF.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-GGUF"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt"    
downloads:
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/diffusion_models/zImageTurboNSFW_82BF16FP16.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/zImageTurboNSFW_82BF16FP16.safetensors
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/diffusion_models/zImageTurboNSFW_72BF16.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/zImageTurboNSFW_72BF16.safetensors
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/clip/Z-Image-AbliteratedV1.f16.gguf
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/clip/Z-Image-AbliteratedV1.f16.gguf
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/vae/Z-Image_natural_vae.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/Z-Image_natural_vae.safetensors
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/vae/Z-Image_half_natural_vae.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/Z-Image_half_natural_vae.safetensors
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/upscale_models/RealESRGAN_x2plus.pth
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/upscale_models/RealESRGAN_x2plus.pth
