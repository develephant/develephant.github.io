version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
git_repos:
  - url: https://github.com/open-webui/open-terminal.git
    dest: "${WORKSPACE}/open-terminal"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt"    
downloads:
  - url: https://huggingface.co/buckets/develephant/comfy-runner
    dest: ${WORKSPACE}/comfy-runner
