version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
git_repos:
  - url: https://github.com/city96/ComfyUI-GGUF.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-GGUF"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt" 
downloads:
  - url: https://huggingface.co/develephant/Flux2/resolve/main/diffusion_models/flux-2-klein-9b.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/flux-2-klein-9b.safetensors
  - url: https://huggingface.co/develephant/Flux2/resolve/main/loras/Flux2-Klein-9B-consistency-V2.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/loras/Flux2-Klein-9B-consistency-V2.safetensors
  - url: https://huggingface.co/develephant/Flux2/resolve/main/vae/flux2-vae.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/flux2-vae.safetensors
  - url: https://huggingface.co/develephant/Flux2/resolve/main/text_encoders/qwen_3_8b_fp8mixed.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen_3_8b_fp8mixed.safetensors
