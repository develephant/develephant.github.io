version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
env: 
  GITHUB_TOKEN: GITHUB_TOKEN
git_repos:
  - url: https://github.com/city96/ComfyUI-GGUF.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-GGUF"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt"   
downloads:
  - url: https://huggingface.co/develephant/Qwen/resolve/main/Turbo/diffusion_models/qwen_image_2.1_turbo_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/qwen_image_2.1_turbo_int8_convrot.safetensors
  - url: https://huggingface.co/develephant/Qwen/resolve/main/Turbo/text_encoders/qwen3.5_9b_qwen_image_2.1_pe_i2i.int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3.5_9b_qwen_image_2.1_pe_i2i.int8_convrot.safetensors
  - url: https://huggingface.co/develephant/Qwen/resolve/main/Turbo/text_encoders/qwen3vl_8b_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3vl_8b_int8_convrot.safetensors
  - url: https://huggingface.co/develephant/Qwen/resolve/main/Turbo/vae/qwen_image_2.1_vae_bf16.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/qwen_image_2.1_vae_bf16.safetensors
