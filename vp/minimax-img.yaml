version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
env: 
  GITHUB_TOKEN: GITHUB_TOKEN
git_repos:
  - url: https://github.com/develephant/ComfyUI-Eve-Nodes.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-Eve-Nodes"
  - url: https://github.com/city96/ComfyUI-GGUF.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-GGUF"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt"  
downloads:
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3-Image/resolve/main/diffusion_models/minimax_h3_image_pruned_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/minimax_h3_image_pruned_int8_convrot.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
  - url: https://huggingface.co/Comfy-Org/Qwen3.5/resolve/main/text_encoders/qwen3.5_9b_w4a8_gptq.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3.5_9b_w4a8_gptq.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3-Image/resolve/main/vae/minimax_h3_image_vae_fp16.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_image_vae_fp16.safetensors