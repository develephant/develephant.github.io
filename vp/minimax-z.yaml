version: 1
auth:
  huggingface:
    token_env: HF_TOKEN
env: 
  GITHUB_TOKEN: GITHUB_TOKEN
git_repos:
  - url: https://github.com/HellerCommaA/ComfyUI-ZImageLatent.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-ZImageLatent"
  - url: https://github.com/city96/ComfyUI-GGUF.git
    dest: "${WORKSPACE:-/workspace}/ComfyUI/custom_nodes/ComfyUI-GGUF"
    post_commands:
      - "uv pip install --no-cache --python /venv/main/bin/python -r requirements.txt"  
downloads:
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_audio_vae_fp32.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/minimax_h3_video_vae_int8_convrot.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  - url: https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - url: https://huggingface.co/lightx2v/Minimax-h3-Turbo/resolve/main/minimax_h3_fl2v_turbo_8step_v1.2_768p_comfyui_bf16.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/loras/minimax_h3_fl2v_turbo_8step_v1.2_768p_comfyui_bf16.safetensors
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/diffusion_models/zImageTurboNSFW_90BF16FP8.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/diffusion_models/zImageTurboNSFW_90BF16FP8.safetensors
  - url: https://huggingface.co/develephant/Qwen/resolve/main/Qwen2.5-VL-7B-Instruct-abliterated.Q4_K_M.gguf
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/text_encoders/Qwen2.5-VL-7B-Instruct-abliterated.Q4_K_M.gguf
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/vae/Z-Image_clear_vae.safetensors
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/vae/Z-Image_clear_vae.safetensors
  - url: https://huggingface.co/develephant/ZIT/resolve/main/models/upscale_models/RealESRGAN_x2plus.pth
    dest: ${WORKSPACE:-/workspace}/ComfyUI/models/upscale_models/RealESRGAN_x2plus.pth